# =====================================================================
#  nav2_amcl 示例参数（ROS2 Humble）
#  作用：收到 /initialpose 后，用激光 scan 与 map 做粒子滤波匹配，
#        持续修正 map -> odom -> base_link，也就是「继续修正雷达位姿」。
#
#  关键：set_initial_pose: false  —— 不要用这里的 (0,0,0) 覆盖视觉初值！
# =====================================================================
amcl:
  ros__parameters:
    use_sim_time: false

    # ---- 帧与话题：必须与 localizer.yaml、雷达驱动一致 ----
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    scan_topic: "scan"
    map_topic: "map"
    tf_broadcast: true
    transform_tolerance: 1.0

    # ---- 初值：交给 AprilTag 节点，通过 /initialpose 注入 ----
    set_initial_pose: false
    always_reset_initial_pose: false
    first_map_only: false
    initial_pose.x: 0.0
    initial_pose.y: 0.0
    initial_pose.z: 0.0
    initial_pose.yaw: 0.0

    # ---- 粒子滤波 ----
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    save_pose_rate: 0.5

    # ---- 运动模型（里程计噪声）----
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    update_min_d: 0.25        # 每移动 0.25 m 至少更新一次
    update_min_a: 0.2         # 每转 0.2 rad 至少更新一次

    # ---- 观测模型：scan 与地图匹配 ----
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    max_beams: 60
    sigma_hit: 0.2
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
